# Deploys dist/ to cPanel on every push to main.
#
# Required GitHub secrets (Settings → Secrets → Actions):
#   FTP_SERVER      e.g. ftp.yourdomain.com
#   FTP_USERNAME    e.g. user@yourdomain.com
#   FTP_PASSWORD    your FTP password
#   FTP_SERVER_DIR  e.g. /public_html/  (must start and end with /)
#
# For FTPS: change protocol to ftps and port to 990 below.
# For SFTP: use .github/workflows/deploy-sftp.yml instead (requires SSH on cPanel).

name: Deploy to cPanel

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build site
        run: npm run build

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftp
          local-dir: ./dist/
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          dangerous-clean-slate: false
