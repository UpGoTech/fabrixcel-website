# Builds dist/ and publishes to GitHub Pages on every push to main.
# Custom domain: www.fabrixcel.com (CNAME written into the artifact).
#
# After first deploy: Settings → Pages → Custom domain → www.fabrixcel.com
# DNS: CNAME www → upgotech.github.io  (plus apex A/AAAA records if needed)
# Then enable Enforce HTTPS once DNS is verified.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build site
        run: npm run build

      - name: Add CNAME for custom domain
        run: echo 'www.fabrixcel.com' > dist/CNAME

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
