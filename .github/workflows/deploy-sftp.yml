# SFTP deploy — use this if your cPanel host has SSH/SFTP enabled.
#
# To switch from FTP to SFTP:
#   1. Disable or delete deploy.yml (or change its trigger branch)
#   2. Rename this file to deploy.yml, OR change "workflow_dispatch" to push/main below
#
# Required GitHub secrets:
#   SFTP_HOST         e.g. yourdomain.com (same as SSH host)
#   SFTP_USERNAME     cPanel username
#   SFTP_PASSWORD     cPanel password (or use SFTP_KEY instead)
#   SFTP_SERVER_DIR   e.g. /home/user/public_html/
#   SFTP_KEY          (optional) private SSH key if not using password

name: Deploy to cPanel (SFTP)

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build site
        run: npm run build

      - name: Deploy via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server: ${{ secrets.SFTP_HOST }}
          username: ${{ secrets.SFTP_USERNAME }}
          password: ${{ secrets.SFTP_PASSWORD }}
          sshPrivateKey: ${{ secrets.SFTP_KEY }}
          port: 22
          localDir: ./dist/
          remoteDir: ${{ secrets.SFTP_SERVER_DIR }}
          deleteRemoteFiles: false
